<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-label="Muuyal">
  <!-- Icono de pestaña. El logo de marca va sobre un cuadrado crema porque a
       16 px, y sobre una barra de pestañas oscura, el trazo terracota suelto
       se pierde. Trazo engrosado (12 en vez de 9) por el mismo motivo. -->
  <rect width="140" height="140" rx="30" fill="#FAF3E7"/>
  <g transform="translate(70 70) scale(0.95) translate(-100 -70)">
    <g fill="none" stroke="#B8502D" stroke-width="12" stroke-linecap="round">
      <path d="M 100 70 C 116 50 142 46 154 58 C 164 68 160 82 148 84 C 139 85.5 133 78 137 71"/>
      <path d="M 100 70 C 116 50 142 46 154 58 C 164 68 160 82 148 84 C 139 85.5 133 78 137 71" transform="rotate(180 100 70)"/>
    </g>
    <g fill="#B8502D">
      <circle cx="100" cy="32" r="10"/>
      <circle cx="100" cy="108" r="10"/>
    </g>
  </g>
</svg>
